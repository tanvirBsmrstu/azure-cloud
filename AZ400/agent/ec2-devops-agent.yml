AWSTemplateFormatVersion: '2010-09-09'
Description: EC2 Self-Hosted Azure DevOps Agent (AZ400 with dedicated VPC)

Parameters:

  KeyName:
    Type: AWS::EC2::KeyPair::KeyName

  DevOpsUrl:
    Type: String

  DevOpsPat:
    Type: String
    NoEcho: true

  AgentPool:
    Type: String
    Default: Default

Resources:

# ✅ VPC
  DevOpsVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: DevOps-VPC
        - Key: Project
          Value: az400

# ✅ Internet Gateway
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Project
          Value: az400

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref DevOpsVPC
      InternetGatewayId: !Ref InternetGateway

# ✅ Public Subnet
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref DevOpsVPC
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: DevOps-Public-Subnet
        - Key: Project
          Value: az400

# ✅ Route Table
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref DevOpsVPC
      Tags:
        - Key: Project
          Value: az400

# ✅ Route to Internet
  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

# ✅ Associate subnet with route table
  SubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

# ✅ Security Group
  DevOpsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow SSH from anywhere (DEV ONLY)
      VpcId: !Ref DevOpsVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: DevOps-SG
        - Key: Project
          Value: az400

# ✅ EC2 Instance
  DevOpsInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t2.micro
      KeyName: !Ref KeyName
      SubnetId: !Ref PublicSubnet
      ImageId: ami-0b3a21dbff1fffb4c

      SecurityGroupIds:
        - !Ref DevOpsSecurityGroup

      Tags:
        - Key: Name
          Value: DevOps-Agent
        - Key: Project
          Value: az400

      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          exec > /var/log/user-data.log 2>&1

          echo "=== SYSTEM UPDATE ==="
          apt-get update -y -qq
          apt-get upgrade -y -qq

          echo "=== INSTALL BASIC TOOLS ==="
          apt-get install -y -qq curl git unzip ca-certificates apt-transport-https software-properties-common

          echo "=== INSTALL AZURE CLI ==="
          curl -sL https://aka.ms/InstallAzureCLIDeb | bash

          echo "=== INSTALL POWERSHELL ==="
          wget -q https://packages.microsoft.com/config/ubuntu/22.04/packages-microsoft-prod.deb -O packages-microsoft-prod.deb
          dpkg -i packages-microsoft-prod.deb
          apt-get update -y -qq
          apt-get install -y -qq powershell

          echo "=== INSTALL .NET SDK 8 ==="
          apt-get install -y -qq dotnet-sdk-8.0

          ############################################

          echo "=== Add AZAGENT USER ==="
          useradd -m -d /home/azagent -s /bin/bash azagent
          sudo -u azagent -H bash -c "
              mkdir -p ~/myagent
              cd ~/myagent

              echo '=== INSTALL AZURE DEVOPS AGENT ===' \$PWD
              curl -sSL -O https://download.agent.dev.azure.com/agent/4.273.0/vsts-agent-linux-x64-4.273.0.tar.gz
              tar zxf vsts-agent-linux-x64-4.273.0.tar.gz

              ./config.sh --unattended \
                --url '${DevOpsUrl}' \
                --auth pat \
                --token '${DevOpsPat}' \
                --pool '${AgentPool}' \
                --agent 'ec2-agent-linux' \
                --acceptTeeEula \
                --runAsService
              echo '=== DEVOPS AGENT CONFIG COMPLETE ==='
          "

          # run as root (no sudo needed)
          cd /home/azagent/myagent
          ./svc.sh install
          ./svc.sh start
          echo '=== DEVOPS AGENT SERVICE REGISTRATION COMPLETE ==='


Outputs:

  PublicIP:
    Description: EC2 Public IP
    Value: !GetAtt DevOpsInstance.PublicIp