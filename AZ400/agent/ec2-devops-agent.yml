AWSTemplateFormatVersion: '2010-09-09'
Description: EC2 Self-Hosted Azure DevOps Agent with Docker, AZ CLI, PowerShell

Parameters:

  KeyName:
    Type: AWS::EC2::KeyPair::KeyName

  MyIP:
    Type: String

  DevOpsUrl:
    Type: String

  DevOpsPat:
    Type: String
    NoEcho: true

  AgentPool:
    Type: String
    Default: Default

Resources:

  DevOpsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow SSH access
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref MyIP
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  DevOpsInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.micro
      KeyName: !Ref KeyName
      ImageId: ami-0fc5d935ebf8bc3bc   # change if using eu-central-1
      SecurityGroupIds:
        - !Ref DevOpsSecurityGroup

      Tags:
        - Key: Name
          Value: DevOps-Agent

      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e

          echo "=== SYSTEM UPDATE ==="
          apt-get update -y
          apt-get upgrade -y

          echo "=== INSTALL BASIC TOOLS ==="
          apt-get install -y curl git unzip apt-transport-https ca-certificates software-properties-common

          echo "=== INSTALL DOCKER ==="
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /usr/share/keyrings/docker.gpg

          echo \
            "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/docker.gpg] \
            https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" \
            > /etc/apt/sources.list.d/docker.list

          apt-get update -y
          apt-get install -y docker-ce docker-ce-cli containerd.io

          systemctl enable docker
          systemctl start docker

          usermod -aG docker ubuntu

          echo "=== INSTALL AZURE CLI ==="
          curl -sL https://aka.ms/InstallAzureCLIDeb | bash

          echo "=== INSTALL POWERSHELL ==="
          wget -q https://packages.microsoft.com/config/ubuntu/22.04/packages-microsoft-prod.deb
          dpkg -i packages-microsoft-prod.deb
          apt-get update -y
          apt-get install -y powershell

          echo "=== INSTALL .NET SDK ==="
          wget https://dot.net/v1/dotnet-install.sh
          chmod +x dotnet-install.sh
          ./dotnet-install.sh --channel 8.0

          echo 'export PATH=$PATH:$HOME/.dotnet' >> /etc/profile

          echo "=== INSTALL AZURE DEVOPS AGENT ==="
          mkdir -p /opt/azagent
          cd /opt/azagent

          curl -O https://vstsagentpackage.azureedge.net/agent/3.236.1/vsts-agent-linux-x64-3.236.1.tar.gz
          tar zxvf vsts-agent-linux-x64-3.236.1.tar.gz

          useradd -m azagentuser || true
          chown -R azagentuser:azagentuser /opt/azagent

          su - azagentuser -c "
            cd /opt/azagent

            ./config.sh --unattended \
              --url '${DevOpsUrl}' \
              --auth pat \
              --token '${DevOpsPat}' \
              --pool '${AgentPool}' \
              --agent 'ec2-agent-$(hostname)' \
              --acceptTeeEula \
              --runAsService
          "

          /opt/azagent/svc.sh install
          /opt/azagent/svc.sh start

Outputs:

  PublicIP:
    Value: !GetAtt DevOpsInstance.PublicIp